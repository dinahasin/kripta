[tool.poetry]
name = "kripta"
version = "0.1.0"
description = "Gestionnaire de mots de passe et crypteur de dossiers avec architecture professionnelle moderne"
authors = ["Dinahasina"]
readme = "README.md"
license = "LICENSE"

[tool.poetry.dependencies]
python = "^3.10"
PySide6 = "^6.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
kripta = "kripta.main:main"
